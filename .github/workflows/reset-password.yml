# 운영 계정 비밀번호 재설정 — 서버 SSH 없이 GitHub Actions(self-hosted runner)로 실행.
#
# 사용:
#   1) 새 비밀번호를 Secret으로 등록:  gh secret set RESET_PASSWORD   (프롬프트에 입력 — 로그·대화에 안 남음)
#   2) 실행:                           gh workflow run reset-password -f email=<계정 이메일>
#   3) 끝나면 Secret 삭제:              gh secret delete RESET_PASSWORD
#
# 등록된 계정 목록을 먼저 출력하고, 입력한 이메일이 실제로 있을 때만 바꾼다(오타로 새 계정이 생기는 것 방지).
# 닉네임·훈련 기록·프로필은 그대로 두고 password_hash만 갱신된다(app.create_user 동작).
name: reset-password

on:
  workflow_dispatch:
    inputs:
      email:
        description: "비밀번호를 바꿀 계정 이메일 (비우면 계정 목록만 출력)"
        required: false
        default: ""

concurrency:
  group: deploy-prod   # 배포와 겹치지 않게

jobs:
  reset:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: List accounts
        run: |
          docker compose -f docker-compose.prod.yml exec -T db \
            psql -U coach -d coach -c "select id, email, nickname, onboarded, created_at::date from users order by id;"

      - name: Reset password
        if: ${{ inputs.email != '' }}
        env:
          EMAIL: ${{ inputs.email }}
          RESET_PASSWORD: ${{ secrets.RESET_PASSWORD }}
        run: |
          if [ -z "$RESET_PASSWORD" ]; then
            echo "❌ Secret RESET_PASSWORD 가 없습니다. 먼저  gh secret set RESET_PASSWORD  로 새 비밀번호를 등록하세요."; exit 1
          fi
          if [ "${#RESET_PASSWORD}" -lt 8 ]; then
            echo "❌ 비밀번호는 8자 이상이어야 합니다."; exit 1
          fi
          EMAIL_LC=$(echo "$EMAIL" | tr '[:upper:]' '[:lower:]' | xargs)
          COUNT=$(docker compose -f docker-compose.prod.yml exec -T db \
            psql -U coach -d coach -tAc "select count(*) from users where email='$EMAIL_LC';")
          if [ "$COUNT" != "1" ]; then
            echo "❌ '$EMAIL_LC' 계정이 없습니다. 위 목록의 이메일을 확인하세요. (새 계정은 만들지 않습니다)"; exit 1
          fi
          docker compose -f docker-compose.prod.yml exec -T -e RESET_PASSWORD api \
            python -c "import asyncio, os; from app.create_user import create_user; uid, created = asyncio.run(create_user('$EMAIL_LC', os.environ['RESET_PASSWORD'])); print(f'updated user id={uid}')"
          echo "✅ '$EMAIL_LC' 비밀번호를 바꿨습니다. 앱에서 새 비밀번호로 로그인하세요. 끝나면  gh secret delete RESET_PASSWORD"
